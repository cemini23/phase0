[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "phase0"
version = "0.2.0"
description = "Phase-0 source audits for third-party agent tools and eval license verification"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "cemini23" }]
keywords = ["agents", "audit", "github", "license", "mcp", "tools"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.4"]

[project.scripts]
phase0 = "phase0.cli:main"

[project.urls]
Homepage = "https://github.com/cemini23/phase0"
Repository = "https://github.com/cemini23/phase0"
Issues = "https://github.com/cemini23/phase0/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/phase0"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
